services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eventseat
      POSTGRES_PASSWORD: eventseat
      POSTGRES_DB: eventseat
    ports:
      - "5432:5432"
    volumes:
      - eventseat-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventseat -d eventseat"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: eventseat
      POSTGRES_PASSWORD: eventseat
      POSTGRES_DB: eventseat_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventseat -d eventseat_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eventseat:eventseat@db:5432/eventseat
      JWT_SECRET: local-compose-secret-local-compose-secret
      ALLOWED_ORIGINS: http://localhost:8000
    ports:
      - "8000:8000"

volumes:
  eventseat-data:
